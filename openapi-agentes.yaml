  /v1/efemerides:
    get:
      tags:
      - Agentes
      operationId: listarEfemeridesAgente
      summary: Efemérides Aprobadas cuya difusión cae en un período.
      description: |
        Devuelve las Efemérides **Aprobadas** cuyo intervalo de difusión (`difusion_desde`–`difusion_hasta`) se **solapa** con
        el período `desde`–`hasta` (R-11). En las de día, el intervalo es esa misma fecha; en las de mes, el mes entero. Solo
        salen Aprobadas: una Propuesta o una Descartada no existe para esta API (DEC-130), y tampoco una Aprobada marcada
        «fuente retirada» (R-12). Cada Efeméride la redactó un modelo de Historia Viva a partir de Fichas Validadas y la
        revisó y firmó una persona de la SEU; el Agente externo la recibe lista para usar y con las Piezas fuente para
        citar. La alerta de inyección no sale por `/v1` (C33).

        **Período.** `desde` y `hasta` son fechas completas y **obligatorios**; `hasta` mayor o igual a `desde` y el rango no
        puede pasar de **92 días** (R-11). Sin Efemérides en el período es `200` con `efemerides: []`. Los ids llevan
        prefijo `efe_<uuid>`. No pagina.

        Este endpoint **reabre** el punto 7 del contrato 1.0.0 («la efeméride deja de ser un producto de Historia Viva»):
        diferencia acordada con el Agente 1 el 13-oct-2026 (ver `x-diferencias-contrato`). Alcance requerido: `efemerides:leer` (R-11), que cubre
        también `GET /v1/relatos`.

        **Cubre:** DIR-45, DEC-130. Rebanada R0 (mock) y R6 (real, R-43 a).
      x-alcance: entra
      security:
      - token_agente: []
      parameters:
      - name: desde
        in: query
        required: true
        description: Inicio del período (fecha completa). Se compara por solapamiento con el intervalo de difusión.
        schema:
          type: string
          format: date
        example: '2026-04-01'
      - name: hasta
        in: query
        required: true
        description: Fin del período (fecha completa). Mayor o igual a `desde`; el rango máximo es de 92 días.
        schema:
          type: string
          format: date
        example: '2026-04-30'
      responses:
        '200':
          description: Efemérides Aprobadas del período. Puede venir vacía.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Solicitud-Id:
              $ref: '#/components/headers/XSolicitudId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEfemerides'
              examples:
                conResultados:
                  summary: Una Efeméride de día y una de mes
                  value:
                    total: 2
                    efemerides:
                    - efemeride_id: efe_4e6a8c02-3d17-4b59-9f81-b3d5f7a9c124
                      tipo: dia
                      dia: 11
                      mes: 4
                      difusion_desde: '2026-04-11'
                      difusion_hasta: '2026-04-11'
                      titulo: Un día como hoy, 11 de abril
                      texto: Un día como hoy, en 2016, la FIE y la UTN firmaron un convenio marco de cooperación académica.
                      piezas_fuente:
                      - pza_5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
                      fragmentos_fuente:
                      - frg_e41d0c7a-2f95-5b3e-a8c1-96d7f0b3c254
                      aprobada_por: mgarcia
                      aprobada_el: '2026-04-03T15:10:00Z'
                    - efemeride_id: efe_8a0c2e46-5f39-4d71-b3a5-d7f9b1c3e546
                      tipo: mes
                      dia: null
                      mes: 4
                      difusion_desde: '2026-04-01'
                      difusion_hasta: '2026-04-30'
                      titulo: Abril en la historia de la FIE
                      texto: En abril de 2016 la FIE y la UTN firmaron un convenio marco de cooperación académica.
                      piezas_fuente:
                      - pza_5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
                      fragmentos_fuente: []
                      aprobada_por: mgarcia
                      aprobada_el: '2026-04-03T15:12:30Z'
                sinResultados:
                  summary: Período sin Efemérides Aprobadas
                  value:
                    total: 0
                    efemerides: []
        '400':
          description: |
            Solicitud mal formada: falta `desde` o `hasta`, fecha inválida, `desde` posterior a `hasta`, período de más de
            92 días o parámetro desconocido. No se reintenta sin corregirla.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Solicitud-Id:
              $ref: '#/components/headers/XSolicitudId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinPeriodo:
                  summary: Falta `hasta`
                  value:
                    codigo: parametros_invalidos
                    mensaje: La consulta de efemérides requiere los parámetros desde y hasta.
                    solicitud_id: req_01JA3X2E9FKY
                periodoLargo:
                  summary: Período de más de 92 días
                  value:
                    codigo: parametros_invalidos
                    mensaje: El período no puede pasar de 92 días.
                    solicitud_id: req_01JA3X2E9FKZ
        '401':
          $ref: '#/components/responses/V1NoAutenticado'
        '403':
          $ref: '#/components/responses/V1NoAutorizado'
        '404':
          $ref: '#/components/responses/V1RutaInexistente'
        '429':
          $ref: '#/components/responses/V1DemasiadasConsultas'
        '503':
          $ref: '#/components/responses/V1NoDisponible'
  /v1/relatos:
    get:
      tags:
      - Agentes
      operationId: listarRelatosAgente
      summary: Relatos Aprobados cuya fecha de aprobación cae en un período.
      description: |
        Devuelve los Relatos **Aprobados** (DEC-147) cuya fecha de aprobación cae en el período `desde`–`hasta`. Un Relato es un
        texto de difusión sobre un hito histórico, **no atado a una fecha**, que nació de una respuesta de la Conversación y
        que una persona de la SEU revisó y firmó. Solo salen Aprobados, sin la marca «fuente retirada» (R-12). La alerta de
        inyección no sale por `/v1` (C33).

        `desde` y `hasta` son fechas completas y **obligatorios**; `hasta` mayor o igual a `desde` y el rango no puede pasar de
        **92 días**. Sin Relatos en el período es `200` con `relatos: []`. Los ids llevan prefijo `rel_<uuid>`. No pagina.
