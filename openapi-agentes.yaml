  /v1/aportes:
    post:
      tags:
      - Agentes
      operationId: registrarAporte
      summary: Registra un aporte de un Agente externo.
      description: |
        Registra contenido generado por un Agente externo. El aporte ingresa al Acervo como una Pieza de clase `texto` en
        estado Pendiente (Ficha v1 con `origen_version = agente_externo`, `creada_por` nulo, original `text/plain;
        charset=utf-8`) y espera validación humana. No se indexa, no es buscable y no se cita por el solo hecho de haber
        llegado por la API (ADR-0002). Una vez Validado es una Pieza más y vuelve por `/v1` como cualquiera (DEC-134).

        **Rechazo por etiquetas de control (DEC-133).** Si el contenido (`titulo` o `cuerpo`) trae
        etiquetas de control de una lista cerrada (`### Instruction:`, `[SYSTEM]`, `<|im_start|>`, `<|system|>`, `[INST]` y
        variantes; la lista vive en `chequeo_inyeccion`), el aporte se **rechaza** con `422 aporte_rechazado`: no crea
        Pieza ni registro de idempotencia. Un documento histórico legítimo que sube una persona se acepta con alerta; el
        rechazo es solo para esta vía. El 422 se evalúa junto con el 400 (forma y contenido), antes del 404.

        `fecha_publicacion` y `url_publicacion` son opcionales. Cuerpo máximo 256 KiB: uno mayor es `400
        parametros_invalidos` (en `/v1` el cuerpo grande es 400, no 413). `piezas_fuente` debe ser de Piezas Validadas (un
        Aporte Validado vale como fuente), si no, `400 fuente_inexistente` (no se distingue el motivo; el `mensaje` lista
        los ids rechazados). `fragmentos_fuente` solo valida forma, no existencia (DEC-146 punto 19).

        La operación es idempotente por `Idempotency-Key`, sin vencimiento (el contrato dice «al menos 30 días»). Con
        el interruptor `api_agentes_habilitada = false` no crea Pieza ni registro de idempotencia: `503` con `Retry-After:
        300`; reintentar con la misma clave.

        **Cubre:** CU-14, RF-25.
      x-alcance: entra
      security:
      - token_agente: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: |
          Clave elegida por el cliente que identifica el intento de registro. Historia Viva la recuerda (el contrato
          1.0.0 dice 30 días; el MVP no la vence: se propone «al menos 30 días»).

          - Clave nueva: se crea la Pieza Pendiente y la respuesta es `201`.
          - Clave ya vista con el mismo cuerpo: no se crea nada y la respuesta es `200` con el mismo cuerpo que devolvió
            el `201` original.
          - Clave ya vista con un cuerpo distinto: `400` con `codigo: idempotency_key_reutilizada`; no se crea nada.

          Se recomienda un UUID v4 por aporte. La clave es propia de cada token: dos Agentes externos distintos no
          colisionan.
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        example: 3f1c9a12-7f0b-4a2e-9a7d-0c5b6e2f1d44
      requestBody:
        required: true
        description: Aporte en JSON, de hasta 256 KiB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aporte'
            examples:
              borradorSinPublicar:
                summary: Gacetilla aprobada, todavía sin publicar
                value:
                  titulo: La FIE celebra diez años de cooperación con la UTN
                  cuerpo: La Facultad de Ingeniería del Ejército conmemora una década del convenio marco de cooperación académica
                    suscripto con la Universidad Tecnológica Nacional en abril de 2016, que articuló carreras de posgrado
                    en ingeniería de materiales y habilitó prácticas profesionales supervisadas.
                  tipo_contenido: gacetilla
                  canal: null
                  piezas_fuente:
                  - pza_5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
                  - pza_c8e1f402-6a3d-4b95-8f17-2e4a6c8d0b93
                  fragmentos_fuente:
                  - frg_e41d0c7a-2f95-5b3e-a8c1-96d7f0b3c254
                  - frg_a7c93e15-0b6d-4f28-9e41-3d5f7a9c1b86
              postPublicado:
                summary: Post ya publicado, con fecha y URL
                value:
                  titulo: Diez años del convenio FIE — UTN
                  cuerpo: En abril de 2016 la FIE firmó con la UTN el convenio que articuló nuestras carreras de posgrado
                    en ingeniería de materiales. Diez años después, sigue vigente.
                  tipo_contenido: post
                  canal: linkedin
                  piezas_fuente:
                  - pza_5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
                  fragmentos_fuente:
                  - frg_e41d0c7a-2f95-5b3e-a8c1-96d7f0b3c254
                  fecha_publicacion: '2026-04-11'
                  url_publicacion: https://www.linkedin.com/feed/update/urn:li:activity:7000000000000000000
      responses:
        '201':
          description: Aporte registrado. Se creó una Pieza en estado Pendiente en la cola de validación humana.
          headers:
            Location:
              description: Ruta de la Pieza creada. Devuelve `404 pieza_no_disponible` hasta que una persona la valide; después,
                la Pieza (DEC-134).
              schema:
                type: string
                format: uri-reference
              example: /v1/piezas/pza_8d0a6c15-93e2-4b7f-a4d0-5e1f7c2b8a39
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Solicitud-Id:
              $ref: '#/components/headers/XSolicitudId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AporteCreado'
              examples:
                creado:
                  summary: Aporte nuevo
                  value:
                    aporte_id: apt_2c71b9e0-4f3a-4a58-b1d6-e08c5a97f312
                    pieza_id: pza_8d0a6c15-93e2-4b7f-a4d0-5e1f7c2b8a39
                    estado: Pendiente
                    recibido_el: '2026-11-03T14:07:55Z'
                    idempotency_key: 3f1c9a12-7f0b-4a2e-9a7d-0c5b6e2f1d44
        '200':
          description: |
            La clave de idempotencia ya había sido registrada con el mismo cuerpo. No se creó nada. El cuerpo es idéntico al
            del `201` original, incluido `recibido_el`.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Solicitud-Id:
              $ref: '#/components/headers/XSolicitudId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AporteCreado'
              examples:
                repetido:
                  summary: Clave repetida
                  value:
                    aporte_id: apt_2c71b9e0-4f3a-4a58-b1d6-e08c5a97f312
                    pieza_id: pza_8d0a6c15-93e2-4b7f-a4d0-5e1f7c2b8a39
                    estado: Pendiente
                    recibido_el: '2026-11-03T14:07:55Z'
                    idempotency_key: 3f1c9a12-7f0b-4a2e-9a7d-0c5b6e2f1d44
        '400':
          description: |
            Solicitud mal formada o con fuente inexistente: cuerpo que no valida, cuerpo mayor a 256 KiB, `Idempotency-Key`
            ausente o mal formada, clave reutilizada con un cuerpo distinto, o `piezas_fuente` que no existe o no está
            Validada. No se reintenta sin corregir la solicitud.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Solicitud-Id:
              $ref: '#/components/headers/XSolicitudId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                claveReutilizada:
                  summary: Clave de idempotencia reutilizada con otro cuerpo
                  value:
                    codigo: idempotency_key_reutilizada
                    mensaje: La clave de idempotencia ya fue usada con un cuerpo distinto. Usá una clave nueva.
                    solicitud_id: req_01JA3X2E9F8K
                claveAusente:
                  summary: Falta la cabecera `Idempotency-Key`
                  value:
                    codigo: parametros_invalidos
                    mensaje: Falta la cabecera Idempotency-Key.
                    solicitud_id: req_01JA3X2E9F9M
                cuerpoGrande:
                  summary: Cuerpo mayor a 256 KiB
                  value:
                    codigo: parametros_invalidos
                    mensaje: El cuerpo supera los 256 KiB admitidos.
                    solicitud_id: req_01JA3X2E9FAN
                fuenteInexistente:
                  summary: Una pieza fuente no existe o no está Validada
                  value:
                    codigo: fuente_inexistente
                    mensaje: 'Fuentes rechazadas: pza_00000000-0000-4000-8000-000000000000.'
                    solicitud_id: req_01JA3X2E9FBP
        '401':
          $ref: '#/components/responses/V1NoAutenticado'
        '403':
          $ref: '#/components/responses/V1NoAutorizado'
        '404':
          $ref: '#/components/responses/V1RutaInexistente'
        '422':
          $ref: '#/components/responses/V1AporteRechazado'
        '429':
          $ref: '#/components/responses/V1DemasiadasConsultas'
        '503':
          $ref: '#/components/responses/V1NoDisponible'
components:
  securitySchemes:
    token_agente:
      type: http
      scheme: bearer
      bearerFormat: hv_<8 hex>_<43 base64url>
      description: |
        `Authorization: Bearer hv_<8 hex>_<43 base64url>`. Un token por Agente externo (N tokens por agente), opaco,
        revocable de forma independiente y sin permiso alguno sobre la interfaz de las personas. Vence a los 180 días.

        Lo emite el Administrador técnico (`OPERAR_SISTEMA`) y se entrega una sola vez, fuera de banda. Nunca se versiona en un
        repositorio. Alcances: `fragmentos:leer`, `piezas:leer`, `aportes:escribir` y `efemerides:leer` (Efemérides y
        Relatos, R-11).

        - Token ausente, mal formado, vencido o revocado (o una cookie en lugar de un token): `401 token_invalido`.
        - Token válido sin el alcance de la operación: `403 operacion_no_permitida`.
  headers:
    XSolicitudId:
      description: Identificador de la solicitud (`req_<ulid>`). El mismo valor va en `solicitud_id` de todo error.
      schema:
        type: string
        pattern: ^req_[0-9A-Za-z]+$
      example: req_01JA3W8K2M9Q
    RetryAfter:
      description: Segundos a esperar antes de reintentar.
      schema:
        type: integer
        minimum: 1
      example: 30
    RateLimitLimit:
      description: |
        Cupo de la ventana vigente del token (ventana fija de 60 s): 60 consultas por minuto (`GET`), 10 aportes por
        minuto (`POST`), 2 búsquedas en vuelo. Formato de borradores anteriores del IETF.
      schema:
        type: integer
        minimum: 1
      example: 60
    RateLimitRemaining:
      description: Solicitudes que quedan en la ventana vigente.
      schema:
        type: integer
        minimum: 0
      example: 57
    RateLimitReset:
      description: Segundos que faltan para que la ventana se reinicie.
      schema:
        type: integer
        minimum: 0
      example: 41
  schemas:
    Error:
      type: object
      title: Error
      description: |
        Forma única de todo error de `/v1`. Excepción deliberada a RFC 9457 (DEC-34, ver `x-excepcion-rfc9457`): el
        contrato 1.0.0 cerró esta forma y prohíbe propiedades extra.
      additionalProperties: false
      required:
      - codigo
      - mensaje
      - solicitud_id
      properties:
        codigo:
          type: string
          description: |
            Código estable, legible por máquina. El cliente decide por este campo, no por el texto de `mensaje`.
          enum:
          - parametros_invalidos
          - idempotency_key_reutilizada
          - fuente_inexistente
          - token_invalido
          - operacion_no_permitida
          - pieza_no_disponible
          - ruta_inexistente
          - aporte_rechazado
          - limite_superado
          - servicio_no_disponible
          example: parametros_invalidos
        mensaje:
          type: string
          description: |
            Explicación en español, para registro y diagnóstico. No revela si una Pieza existe pero no está Validada.
          example: La consulta requiere al menos uno de los parámetros q, desde o hasta.
        solicitud_id:
          type: string
          description: Identificador de la solicitud en los registros de Historia Viva. Igual a `X-Solicitud-Id`.
          example: req_01JA3X2E9F5G
    PrecisionFecha:
      type: string
      title: Precisión de la fecha
      description: |
        Precisión declarada del rango de fechas de la Pieza. Una fecha exacta es un rango de un solo día con precisión
        `dia`. `rango` (v1.1, DEC-60) es un intervalo declarado como tal («entre 2015 y 2019»): se redacta «entre X y Y».

        El Agente externo no puede presentar como fecha exacta una Pieza cuya precisión sea `mes`, `anio`, `decada` o
        `rango`.
      enum:
      - dia
      - mes
      - anio
      - decada
      - rango
      example: dia
    IdPiezaV1:
      type: string
      pattern: ^pza_[A-Za-z0-9._-]{1,60}$
      description: 'Identificador estable de una Pieza en `/v1`: prefijo `pza_` y UUID en minúscula. El patrón es el del contrato
        1.0.0; el UUID se valida dentro del codec (un id con forma inválida es 400 `parametros_invalidos`).'
      example: pza_5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
    IdFragmentoV1:
      type: string
      pattern: ^frg_[A-Za-z0-9._-]{1,60}$
      description: 'Identificador de un fragmento en `/v1`: prefijo `frg_` y UUID.'
      example: frg_e41d0c7a-2f95-5b3e-a8c1-96d7f0b3c254
    IdAporteV1:
      type: string
      pattern: ^apt_[A-Za-z0-9._-]{1,60}$
      description: 'Identificador de un aporte en `/v1`: prefijo `apt_` y UUID.'
      example: apt_2c71b9e0-4f3a-4a58-b1d6-e08c5a97f312
    IdLoteV1:
      type: string
      pattern: ^lot_[A-Za-z0-9._-]{1,60}$
      description: 'Identificador de un Lote en `/v1`: prefijo `lot_` y UUID.'
      example: lot_c3b8e7a4-1d2f-4e6a-b5c9-0a1b2c3d4e5f
    TipoPieza:
      type: string
      title: Tipo de Pieza
      description: |
        Tipo de Pieza del Acervo. **Enum abierto** (SUPUESTO, consultas C4, C23 y C24): el cliente no debe tratar esta lista
        como cerrada; puede aparecer un valor nuevo cuando el Administrador técnico agrega un tipo (sube la versión menor del
        contrato). Los cinco primeros son los del contrato 1.0.0; `nota`, `plano`, `planilla` y `video` son aditivos.
      enum:
      - fotografia
      - acta
      - resolucion
      - convenio
      - memoria
      - nota
      - plano
      - planilla
      - video
      example: convenio
    TipoContenido:
      type: string
      title: Tipo de contenido del aporte
      description: |
        Clase de contenido que produjo el Agente externo. El enum se acordó con el Agente 1 el 13-oct-2026 (C16):
        `newsletter` suma a los tres valores provisorios del contrato 1.0.0.
      enum:
      - gacetilla
      - post
      - comunicado
      - newsletter
      example: gacetilla
    Canal:
      type:
      - string
      - 'null'
      title: Canal de difusión
      description: |
        Canal al que está destinado el aporte. `null` cuando el contenido no tiene canal propio, como una gacetilla.
        El enum se acordó con el Agente 1 el 13-oct-2026 (C16): `correo` suma a los valores provisorios del contrato 1.0.0
        y es el canal de la newsletter.
      enum:
      - instagram
      - linkedin
      - web
      - correo
      - null
      example: linkedin
    Fragmento:
      type: object
      title: Fragmento
      description: |
        Un pasaje de una Ficha Validada, con su cita. Es la unidad que Historia Viva entrega. Nunca es prosa redactada por un
        modelo.
      additionalProperties: false
      required:
      - fragmento_id
      - pieza_id
      - texto
      - fecha_inicio
      - fecha_fin
      - precision_fecha
      - tipo
      - resumen_pieza
      - url_original
      - validada_el
      - pagina
      - seccion
      properties:
        fragmento_id:
          allOf:
          - $ref: '#/components/schemas/IdFragmentoV1'
          description: |
            Identificador estable del pasaje dentro de la Pieza. Permite citar el pasaje exacto que fundamenta una
            afirmación, no solo el documento. Se mantiene estable mientras el cuerpo de la Ficha no cambie; si una persona
            edita y vuelve a validar la Ficha, los fragmentos se recalculan y pueden cambiar de identificador.
            `pieza_id` sí es estable siempre.
        pieza_id:
          allOf:
          - $ref: '#/components/schemas/IdPiezaV1'
          description: Identificador estable de la Pieza a la que pertenece el fragmento.
        texto:
          type: string
          description: |
            Texto del pasaje, tomado del cuerpo de la Ficha Validada. En un video es lo que escribió una persona.
          example: En la ciudad de Buenos Aires, a los once días del mes de abril de 2016, se suscribe el convenio marco de
            cooperación académica entre la Facultad de Ingeniería del Ejército y la Universidad Tecnológica Nacional.
        fecha_inicio:
          type: string
          format: date
          description: Inicio del rango de fechas de la Pieza.
          example: '2016-04-11'
        fecha_fin:
          type: string
          format: date
          description: Fin del rango de fechas de la Pieza. Igual a `fecha_inicio` cuando la fecha es exacta.
          example: '2016-04-11'
        precision_fecha:
          $ref: '#/components/schemas/PrecisionFecha'
        tipo:
          $ref: '#/components/schemas/TipoPieza'
        resumen_pieza:
          type: string
          description: Resumen validado de la Pieza. Sirve para decidir si el fragmento es relevante sin pedir la Pieza completa.
          example: Convenio marco de cooperación académica entre la FIE y la Universidad Tecnológica Nacional, firmado en
            abril de 2016.
        url_original:
          type: string
          format: uri
          description: |
            URL de la Pieza en Historia Viva, armada con `HV_URL_PUBLICA` (`{HV_URL_PUBLICA}/validar.html?pieza=<uuid>`). La
            abre una persona de la FIE con su sesión; el Agente 1 no puede abrirla (DEC-35). Mientras no haya servidor, el
            enlace solo abre en la PC del alumno (DEC-119, DEC-146 punto 10). Historia Viva no sirve binarios por esta API.
          example: http://localhost:8000/validar.html?pieza=5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
        validada_el:
          type: string
          format: date-time
          description: Momento en que una persona identificada firmó la Ficha.
          example: '2026-11-10T15:22:41Z'
        pagina:
          type:
          - integer
          - 'null'
          minimum: 1
          description: |
            Página del archivo original donde está el pasaje. `null` cuando la Pieza no tiene paginación o la transcripción
            no la conservó: una fotografía, una planilla o un video nunca la tienen.
          example: 1
        seccion:
          type:
          - string
          - 'null'
          description: |
            Sección, cláusula o artículo donde está el pasaje. En una planilla es el nombre de la hoja; en un video, la marca
            `HH:MM:SS` si la hay. `null` cuando la Pieza no tiene una estructura interna nombrada.
          example: Cláusula primera — Objeto
    RespuestaFragmentos:
      type: object
      title: Respuesta de búsqueda
      additionalProperties: false
      required:
      - total
      - limite
      - fragmentos
      properties:
        total:
          type: integer
          minimum: 0
          description: |
            Cantidad de fragmentos devueltos en `fragmentos`. Historia Viva no informa cuántos existirían más allá del
            límite: no hay paginación en `/v1`.
          example: 3
        limite:
          type: integer
          minimum: 1
          maximum: 50
          description: Límite efectivamente aplicado a la consulta.
          example: 10
        fragmentos:
          type: array
          description: Fragmentos ordenados por relevancia. Lista vacía si no hubo coincidencias.
          maxItems: 50
          items:
            $ref: '#/components/schemas/Fragmento'
    Pieza:
      type: object
      title: Pieza
      description: |
        Ficha Validada completa de una Pieza del Acervo. Forma cerrada: no hay campos adicionales. Los campos internos de
        Historia Viva —marca de chequeo de inyección, estados intermedios— no se exponen.
      additionalProperties: false
      required:
      - pieza_id
      - tipo
      - estado
      - resumen
      - texto
      - fecha_inicio
      - fecha_fin
      - precision_fecha
      - origen
      - lote_id
      - lote_nombre
      - url_original
      - validada_por
      - validada_el
      - modo_validacion
      - fragmentos
      properties:
        pieza_id:
          $ref: '#/components/schemas/IdPiezaV1'
        tipo:
          $ref: '#/components/schemas/TipoPieza'
        estado:
          type: string
          description: 'Estado de la Pieza. Siempre `Validada`: esta API no expone material Pendiente ni Incompleto.'
          enum:
          - Validada
          example: Validada
        resumen:
          type: string
          description: Resumen validado de la Pieza.
        texto:
          type: string
          description: |
            Cuerpo íntegro de la Ficha: la transcripción del documento, o la descripción validada de la imagen más el OCR
            de su texto visible, más el contexto aportado por personas.
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
          description: Fin del rango. Igual a `fecha_inicio` cuando la fecha es exacta.
        precision_fecha:
          $ref: '#/components/schemas/PrecisionFecha'
        origen:
          type: string
          description: De dónde proviene la Pieza dentro del Acervo.
          example: Secretaría de Extensión Universitaria — archivo de convenios
        lote_id:
          oneOf:
          - $ref: '#/components/schemas/IdLoteV1'
          - type: 'null'
          description: Lote con el que se cargó la Pieza. `null` si se cargó fuera de un Lote.
        lote_nombre:
          type:
          - string
          - 'null'
          description: Nombre del Lote. `null` si no hay Lote.
        url_original:
          type: string
          format: uri
          description: URL de la Pieza en Historia Viva (ver `Fragmento.url_original`).
        validada_por:
          type: string
          description: Parte local del email institucional de quien firmó la Ficha (SUPUESTO; el contrato decía «handle»).
          example: mgarcia
        validada_el:
          type: string
          format: date-time
          description: Momento de la firma.
        modo_validacion:
          type: string
          description: Cómo se validó la Ficha. Una validación en bloque y una individual no merecen la misma confianza.
          enum:
          - individual
          - bloque
          example: individual
        fragmentos:
          type: array
          description: Todos los fragmentos de esta Pieza, en el orden en que aparecen en el cuerpo de la Ficha.
          items:
            $ref: '#/components/schemas/Fragmento'
    Aporte:
      type: object
      title: Aporte
      description: |
        Contenido generado por un Agente externo que se registra en el Acervo. Ingresa siempre en estado Pendiente.
        Máximo 256 KiB en total.
      additionalProperties: false
      required:
      - titulo
      - cuerpo
      - tipo_contenido
      - piezas_fuente
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 300
          example: La FIE celebra diez años de cooperación con la UTN
        cuerpo:
          type: string
          minLength: 1
          maxLength: 20000
          description: Texto completo del contenido generado.
        tipo_contenido:
          $ref: '#/components/schemas/TipoContenido'
        canal:
          $ref: '#/components/schemas/Canal'
        piezas_fuente:
          type: array
          description: |
            Piezas del Acervo que el Agente externo usó como fuente. Puede venir vacía. Una pieza que no existe, no está
            Validada hace fallar la solicitud con `400 fuente_inexistente`.
          maxItems: 50
          items:
            $ref: '#/components/schemas/IdPiezaV1'
        fragmentos_fuente:
          type: array
          description: |
            Fragmentos concretos que fundamentan el contenido. Opcional. Solo se valida la forma del identificador.
          maxItems: 200
          items:
            $ref: '#/components/schemas/IdFragmentoV1'
        fecha_publicacion:
          type:
          - string
          - 'null'
          format: date
          description: Fecha en que el contenido se publicó. Opcional.
          example: '2026-04-11'
        url_publicacion:
          type:
          - string
          - 'null'
          format: uri
          description: Enlace a la publicación. Opcional.
          example: https://www.linkedin.com/feed/update/urn:li:activity:7000000000000000000
    AporteCreado:
      type: object
      title: Aporte registrado
      description: |
        Acuse del registro. El mismo cuerpo se devuelve con `201` la primera vez y con `200` ante una clave de idempotencia
        repetida.
      additionalProperties: false
      required:
      - aporte_id
      - pieza_id
      - estado
      - recibido_el
      - idempotency_key
      properties:
        aporte_id:
          $ref: '#/components/schemas/IdAporteV1'
        pieza_id:
          allOf:
          - $ref: '#/components/schemas/IdPiezaV1'
          description: |
            Pieza creada en el Acervo. Consultarla por `GET /v1/piezas/{pieza_id}` devuelve `404 pieza_no_disponible` hasta
            que una persona la valide; después, la Pieza (DEC-134).
        estado:
          type: string
          description: Estado de ingreso. Siempre `Pendiente` (ADR-0002).
          enum:
          - Pendiente
          example: Pendiente
        recibido_el:
          type: string
          format: date-time
          description: Momento en que Historia Viva recibió el aporte por primera vez. No cambia ante una clave repetida.
          example: '2026-11-03T14:07:55Z'
        idempotency_key:
          type: string
          description: Clave de idempotencia con la que se registró el aporte.
          example: 3f1c9a12-7f0b-4a2e-9a7d-0c5b6e2f1d44
    IdEfemerideV1:
      type: string
      pattern: ^efe_[A-Za-z0-9._-]{1,60}$
      description: 'Identificador de una Efeméride en `/v1`: prefijo `efe_` y UUID (el UUID se valida dentro del codec, como
        el resto de los ids de `/v1`).'
      example: efe_4e6a8c02-3d17-4b59-9f81-b3d5f7a9c124
    EfemerideAgente:
      type: object
      title: Efeméride Aprobada
      description: |
        Texto breve de difusión que Historia Viva redactó a partir de Fichas Validadas y que una persona de la SEU revisó y
        firmó. Forma cerrada. No lleva la alerta de inyección (C33).
      additionalProperties: false
      required:
      - efemeride_id
      - tipo
      - dia
      - mes
      - difusion_desde
      - difusion_hasta
      - titulo
      - texto
      - piezas_fuente
      - fragmentos_fuente
      - aprobada_por
      - aprobada_el
      properties:
        efemeride_id:
          $ref: '#/components/schemas/IdEfemerideV1'
        tipo:
          type: string
          enum:
          - dia
          - mes
          description: '`dia`: «un día como hoy». `mes`: «en octubre de…».'
        dia:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 31
          description: '`null` en las de mes.'
        mes:
          type: integer
          minimum: 1
          maximum: 12
        difusion_desde:
          type: string
          format: date
          description: 'Intervalo de difusión (R-11): en las de día, la misma fecha que `difusion_hasta`; en las de mes, el
            mes entero.'
        difusion_hasta:
          type: string
          format: date
        titulo:
          type: string
        texto:
          type: string
          description: Texto aprobado.
        piezas_fuente:
          type: array
          items:
            $ref: '#/components/schemas/IdPiezaV1'
        fragmentos_fuente:
          type: array
          items:
            $ref: '#/components/schemas/IdFragmentoV1'
        aprobada_por:
          type: string
          description: Parte local del email institucional de quien aprobó (SUPUESTO, como `validada_por`).
        aprobada_el:
          type: string
          format: date-time
    RespuestaEfemerides:
      type: object
      additionalProperties: false
      required:
      - total
      - efemerides
      properties:
        total:
          type: integer
          minimum: 0
        efemerides:
          type: array
          items:
            $ref: '#/components/schemas/EfemerideAgente'
    IdRelatoV1:
      type: string
      pattern: ^rel_[A-Za-z0-9._-]{1,60}$
      description: 'Identificador de un Relato en `/v1`: prefijo `rel_` y UUID (el UUID se valida dentro del codec).'
      example: rel_7c2e4a60-1b38-4d95-a0f7-d9e1b3c5f786
    RelatoAgente:
      type: object
      title: Relato Aprobado
      description: |
        Texto de difusión sobre un hito histórico, no atado a una fecha (DEC-147), que nació de una respuesta de la
        Conversación y que una persona de la SEU revisó y firmó. Forma cerrada. No lleva la alerta de inyección (C33).
      additionalProperties: false
      required:
      - relato_id
      - titulo
      - texto
      - piezas_fuente
      - fragmentos_fuente
      - aprobado_por
      - aprobado_el
      properties:
        relato_id:
          $ref: '#/components/schemas/IdRelatoV1'
        titulo:
          type: string
        texto:
          type: string
          description: Texto aprobado.
        piezas_fuente:
          type: array
          items:
            $ref: '#/components/schemas/IdPiezaV1'
        fragmentos_fuente:
          type: array
          items:
            $ref: '#/components/schemas/IdFragmentoV1'
        aprobado_por:
          type: string
          description: Parte local del email institucional de quien aprobó (SUPUESTO, como `validada_por`).
        aprobado_el:
          type: string
          format: date-time
    RespuestaRelatos:
      type: object
      additionalProperties: false
      required:
      - total
      - relatos
      properties:
        total:
          type: integer
          minimum: 0
        relatos:
          type: array
          items:
            $ref: '#/components/schemas/RelatoAgente'
  responses:
    V1NoAutenticado:
      description: |
        Falta el token, está mal formado, venció o fue revocado; o se mandó una cookie en lugar de un token. El cliente no
        reintenta: pide un token nuevo. Es la única respuesta de `/v1` sin `RateLimit-*`: el cupo es por token y acá no
        hay token válido.
      headers:
        X-Solicitud-Id:
          $ref: '#/components/headers/XSolicitudId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tokenInvalido:
              value:
                codigo: token_invalido
                mensaje: Token ausente, vencido o revocado.
                solicitud_id: req_01JA3X2E9FCQ
    V1NoAutorizado:
      description: |
        El token es válido pero no tiene el alcance de esta operación (`fragmentos:leer`, `piezas:leer`,
        `aportes:escribir` o `efemerides:leer`). El cliente no reintenta: avisa a los responsables.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-Solicitud-Id:
          $ref: '#/components/headers/XSolicitudId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinAlcance:
              value:
                codigo: operacion_no_permitida
                mensaje: El token no tiene permiso para esta operación.
                solicitud_id: req_01JA3X2E9FDR
    V1NoEncontrada:
      description: |
        La Pieza no existe, no está Validada o está retirada. La respuesta es idéntica en todos los casos: no se revela
        cuál ocurrió.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-Solicitud-Id:
          $ref: '#/components/headers/XSolicitudId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noDisponible:
              value:
                codigo: pieza_no_disponible
                mensaje: No hay una Pieza Validada con ese identificador.
                solicitud_id: req_01JA3X2E9FES
    V1RutaInexistente:
      description: |
        Ruta o método desconocido bajo `/v1`, con token válido (informativo: un 4xx no se reintenta). Se agrega en v1.1.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-Solicitud-Id:
          $ref: '#/components/headers/XSolicitudId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rutaInexistente:
              value:
                codigo: ruta_inexistente
                mensaje: No existe esa ruta en la API de agentes.
                solicitud_id: req_01JA3X2E9FFT
    V1DemasiadasConsultas:
      description: |
        Se agotó la ventana del token (60 consultas por minuto, 10 aportes por minuto o 2 búsquedas en vuelo). Historia Viva
        no encola ni reintenta; el cliente espera lo indicado en `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-Solicitud-Id:
          $ref: '#/components/headers/XSolicitudId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            limite:
              value:
                codigo: limite_superado
                mensaje: Se superó el límite de consultas para este token.
                solicitud_id: req_01JA3X2E9FGV
    V1NoDisponible:
      description: |
        Historia Viva no puede atender la solicitud: interruptor `api_agentes_habilitada = false` (`Retry-After: 300`), base
        o motor de embeddings caídos, búsqueda que tarda más de 12 s, o falla no prevista (`Retry-After: 30`). Nunca se
        responde un `200` vacío en su lugar. El Agente externo no publica ni atribuye hechos históricos: registra la falla
        para revisión humana.
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar. `300` con el interruptor; `30` con base o motor caídos.
          schema:
            type: integer
            minimum: 1
          example: 300
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-Solicitud-Id:
          $ref: '#/components/headers/XSolicitudId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            pausado:
              summary: 'Interruptor activado (`Retry-After: 300`)'
              value:
                codigo: servicio_no_disponible
                mensaje: Historia Viva no está disponible en este momento.
                solicitud_id: req_01JA3X2E9FHW
            motorCaido:
              summary: 'Base o motor de embeddings caídos, o búsqueda sobre 12 s (`Retry-After: 30`)'
              value:
                codigo: servicio_no_disponible
                mensaje: Historia Viva no está disponible en este momento.
