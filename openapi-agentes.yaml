  contrato: 4 valores (`dia`, `mes`, `anio`, `decada`).
  mvp: '5 valores: suma `rango` («entre 2015 y 2019»). Regla de redacción: «entre X y Y» (DEC-60).'
  cual_manda: MVP (aditivo; rompe clientes estrictos con enum cerrado).
  avisar_a_juan: Sí.
- tema: Forma de los ids
  acordada: '13-oct-2026 (Juan, PREGUNTAS.md P-03: ACEPTAR)'
  contrato: Strings con patrón `^pza_[A-Za-z0-9._-]{1,60}$` para la Pieza; los ejemplos usan `pza_2016-0412`, `frg_01H9…-0003`,
    `apt_2026-0475`.
  mvp: '`pza_<uuid>`, `frg_<uuid>`, `apt_<uuid>`, `lot_<uuid>` (DEC-62). Este YAML conserva el patrón del contrato 1.0.0 (`^pza_[A-Za-z0-9._-]{1,60}$`;
    DEC-146 punto 18) y el UUID se valida dentro del codec; un id con forma inválida es 400 `parametros_invalidos`. Para `frg_`,
    `apt_`, `lot_` y `efe_` se usa el mismo patrón con su prefijo (el contrato 1.0.0 no fija patrón). Los ejemplos pasan a
    UUID.'
  cual_manda: Patrón del contrato 1.0.0; el UUID lo valida el codec.
  avisar_a_juan: Sí (solo que los ejemplos cambian).
- tema: TipoPieza
  acordada: '13-oct-2026 (Juan, PREGUNTAS.md P-04: ACEPTAR)'
  contrato: 'Enum abierto de 5: `fotografia`, `acta`, `resolucion`, `convenio`, `memoria`.'
  mvp: '9 valores: suma `nota`, `plano`, `planilla`, `video` (SUPUESTO; consultas C4, C23, C24). Los tipos los siembra la
    migración (DEC-105); `POST /api/admin/tipos` queda fuera del MVP y, si se agregara, sube la versión menor del contrato.'
