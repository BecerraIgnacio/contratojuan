      - Agentes
      operationId: buscarFragmentos
      summary: Busca fragmentos de Fichas Validadas.
      description: |
        Punto de entrada de toda consulta. Recibe una consulta en lenguaje natural y devuelve fragmentos de Fichas
        Validadas, cada uno con su cita al archivo original.

        El rango de fechas y el tipo se aplican como filtro duro antes de la búsqueda semántica (por solapamiento de
        rangos). Un resultado sin coincidencias es `200` con `fragmentos: []` y `total: 0`: no es un error. Si no se puede
        responder (embedding caído o más de 12 s) es `503`, **nunca** un `200` vacío.

        Solo salen Piezas Validadas y no retiradas, de cualquier vía de ingreso: un Aporte Validado es una Pieza más y
        vuelve por acá como cualquiera (DEC-134). La alerta de inyección no sale (C33). Un parámetro
        desconocido es `400 parametros_invalidos`.

        Las Efemérides Aprobadas se piden por `GET /v1/efemerides` (DEC-130). Esta búsqueda sigue siendo la
        vía para armar una pieza temática o una efeméride propia con `precision_fecha`.

        Planillas: `seccion` es el nombre de la hoja y `pagina` es `null`. Video: `pagina` es `null`, `seccion` es la marca
        `HH:MM:SS` si el fragmento la tiene (si no, `null`) y `texto` lo escribió una persona.

        **Cubre:** CU-12, RF-23, RF-24, RF-26.
      x-alcance: entra
      security:
      - token_agente: []
      parameters:
      - name: q
        in: query
        required: false
        description: |
          Consulta en lenguaje natural. Se resuelve por búsqueda semántica sobre el cuerpo de las Fichas Validadas. Si se
          omite, hay que enviar al menos `desde` o `hasta`: una consulta sin ningún criterio responde `400`.
        schema:
          type: string
          minLength: 3
          maxLength: 500
        example: convenios de cooperación con universidades nacionales
      - name: desde
        in: query
        required: false
        description: 'Filtro duro: excluye toda Pieza cuya `fecha_fin` sea anterior a esta fecha.'
        schema:
          type: string
          format: date
        example: '2015-01-01'
      - name: hasta
        in: query
        required: false
        description: 'Filtro duro: excluye toda Pieza cuya `fecha_inicio` sea posterior a esta fecha.'
        schema:
          type: string
          format: date
        example: '2019-12-31'
      - name: tipo
        in: query
        required: false
        description: 'Filtro duro por tipo de Pieza. Enum abierto: ver el esquema `TipoPieza`.'
        schema:
          $ref: '#/components/schemas/TipoPieza'
      - name: limite
        in: query
        required: false
        description: Cantidad máxima de fragmentos a devolver.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        example: 10
      responses:
        '200':
          description: Búsqueda resuelta. Puede venir vacía.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Solicitud-Id:
              $ref: '#/components/headers/XSolicitudId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaFragmentos'
              examples:
                conResultados:
                  summary: Consulta con resultados (convenio 2016, acta 2018, foto de 1972)
                  value:
                    total: 3
                    limite: 10
                    fragmentos:
                    - fragmento_id: frg_e41d0c7a-2f95-5b3e-a8c1-96d7f0b3c254
                      pieza_id: pza_5b2e9c40-7a13-4d88-9f06-1c3a8e4d2b77
                      texto: En la ciudad de Buenos Aires, a los once días del mes de abril de 2016, se suscribe el convenio
                        marco de cooperación académica entre la Facultad de Ingeniería del Ejército y la Universidad Tecnológica
                        Nacional, con el objeto de articular carreras de posgrado en ingeniería de materiales.
