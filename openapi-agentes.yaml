    V1AporteRechazado:
      description: |
        El contenido del Aporte trae etiquetas de control de una lista cerrada (`### Instruction:`, `[SYSTEM]`,
        `<|im_start|>`, `<|system|>`, `[INST]` y variantes; la lista vive en `chequeo_inyeccion`). Historia Viva **rechaza**
        el Aporte: no crea Pieza ni registro de idempotencia (DEC-133). El Agente externo no reintenta sin quitar esas
        etiquetas. Lo que sube una persona, en cambio, se acepta con alerta.
