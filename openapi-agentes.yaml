        íntegro y todos sus fragmentos. Forma cerrada (`additionalProperties: false`).

        Un Aporte Validado se devuelve como cualquier Pieza (DEC-134). Si la Pieza no existe, no está
        Validada o está retirada, la respuesta es `404 pieza_no_disponible` con el mismo cuerpo en todos los casos. Un `404`
