x-excepcion-rfc9457:
  alcance: /v1
  decision: DEC-34
  explicacion: |
    `/api`, `/api/admin` y `/auth` (JSON) responden errores con RFC 9457 (`application/problem+json`, esquema
    `Problema`). `/v1` NO lo hace: conserva el esquema `Error` del contrato cerrado con Juan
    (`{codigo, mensaje, solicitud_id}`, `additionalProperties: false`). El contrato 1.0.0 prohíbe propiedades
    extra en `Error` y el cliente del Agente 1 ya decide por `codigo`; cambiar el formato rompería un contrato
    acordado. Resultado: un catálogo interno de errores y dos serializadores. Los `codigo` de `/v1` son los del
    `openapi.yaml` 1.0.0 (`parametros_invalidos`, `idempotency_key_reutilizada`, `token_invalido`,
    `operacion_no_permitida`, `pieza_no_disponible`, `limite_superado`, `servicio_no_disponible`) más
    `fuente_inexistente` y `ruta_inexistente` (DEC-67) y, desde el 10-oct, `aporte_rechazado` (422, DEC-133, R-29; acordado con
    el Agente 1 el 13-oct-2026). En `/v1` el cuerpo grande y la cabecera ausente son 400 `parametros_invalidos` (no 413) y una falla no prevista
    es 503 (no 500).
x-diferencias-contrato:
- tema: Formato de error (excepción RFC 9457)
  contrato: '`{codigo, mensaje, solicitud_id}`; `Error` con `additionalProperties:false`.'
  mvp: '`/v1` conserva ese formato; `/api` y `/auth` usan RFC 9457. Un catálogo interno, dos serializadores. Este YAML lo
    documenta como diferencia explícita (`x-excepcion-rfc9457`).'
  cual_manda: Contrato en `/v1`; RFC 9457 en `/api` y `/auth`.
  avisar_a_juan: No (no cambia nada para él).
