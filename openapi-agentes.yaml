    `limite_superado`, `servicio_no_disponible`.'
  mvp: 'Suma `fuente_inexistente` (400) y `ruta_inexistente` (404). Sin 413 ni 500: el cuerpo grande y la cabecera ausente
    son `parametros_invalidos`; la falla no prevista es 503.'
