openapi: 3.1.0
info:
  title: Historia Viva — API para Agentes externos (/v1)
  version: 1.1.0-rc2
  summary: Contrato `/v1` entre Historia Viva y el Agente 1 del Proyecto Centenario. Borrador `contrato-a1/v1.1.0-rc2`.
  description: |
    Historia Viva custodia el Acervo histórico de la Facultad de Ingeniería del Ejército (FIE). Esta API es la que usan
    los Agentes externos (el Agente 1 del Proyecto Centenario) para consultar el Acervo validado y enviar Aportes. Credencial: `Authorization: Bearer hv_<8 hex>_<43 base64url>` (Token de Agente) con su alcance.

    **Dos reglas que no se negocian.**
    1. Solo sale material Validado y no retirado. Un Aporte Validado es una Pieza más y vuelve por `/v1` como cualquiera
       (DEC-134). Una Pieza inexistente, no Validada o retirada responde `404 pieza_no_disponible` con el mismo cuerpo.
    2. Todo lo que entra queda Pendiente: un Aporte espera validación humana. Si trae etiquetas de control, se rechaza con
       `422 aporte_rechazado` (DEC-133).

    **Convenciones.**
    - Ids con prefijo y UUID: `pza_<uuid>`, `frg_<uuid>`, `apt_<uuid>`, `lot_<uuid>`, `efe_<uuid>`, `rel_<uuid>`. El patrón
      del esquema es el del contrato 1.0.0; el UUID lo valida el servidor.
    - Fechas de la Pieza: `YYYY-MM-DD` con `precision_fecha` (`dia`, `mes`, `anio`, `decada` y, desde la 1.1, `rango`).
      Momentos: RFC 3339 UTC con `Z`.
    - Error: `{codigo, mensaje, solicitud_id}`. Toda respuesta lleva `X-Solicitud-Id: req_<ulid>`, el mismo valor que
      `solicitud_id`; sirve para seguir una solicitud de punta a punta entre los dos agentes (DIR-86).
    - Orden de chequeos: `401 token → 503 interruptor → 403 alcance → 429 límite → 400 forma (y 422 contenido) → 404`.
    - `url_original` se arma con `HV_URL_PUBLICA` (`{HV_URL_PUBLICA}/validar.html?pieza=<uuid>`) y la abre una persona
      de la FIE con su sesión. Mientras no haya servidor, el enlace solo abre en la PC del alumno.
    - Nada de `DELETE`. Todo `4xx` es definitivo: no se reintenta sin corregir el pedido.

    **Acordado con el Agente 1.** Las diferencias con la 1.0.0 están en `x-diferencias-contrato`; las que llevan
    `acordada` (fecha y dónde) ya las aceptaste por escrito el 13-oct-2026 o las pediste vos: `precision_fecha` `rango`,
    la forma de los ids, los tipos nuevos de `TipoPieza`, los códigos de error nuevos, el 400 por parámetros
    desconocidos, la idempotencia sin vencimiento, `url_original`, los límites de consultas, la rotación de token,
    `GET /v1/efemerides`, `GET /v1/relatos` (alcance `efemerides:leer`), el Aporte Validado que vuelve por `/v1`, el
    `422 aporte_rechazado` y los valores `newsletter` (`TipoContenido`) y `correo` (`Canal`). No queda ninguna
    propuesta abierta.

    **Mock.** Junto con este archivo va `compose.yaml`: `docker compose up` levanta Prism 5.16.0 en
    `http://localhost:4010` (sin Docker: `npx @stoplight/prism-cli@5.16.0 mock openapi-agentes.yaml`). Cada escenario
    es un ejemplo con nombre de este archivo y se pide con `Prefer: code=<status>, example=<nombre>`, sobre un pedido
    válido (token `Bearer`, parámetros obligatorios, `Idempotency-Key` y cuerpo en `POST /v1/aportes`); por ejemplo,
    `Prefer: code=429, example=limite` o `Prefer: code=422, example=aporteRechazado`.

    **Prism no guarda estado.** No distingue el primer envío de un reintento ni cuenta consultas: el `201` y el `200`
    de `POST /v1/aportes` se fuerzan con `Prefer`. La idempotencia y los cupos se prueban contra la API real, en la
    sesión presencial. El `422 aporte_rechazado` solo sale con `Prefer`: la detección real de etiquetas de control se
    prueba contra la API. En el mock, `X-Solicitud-Id` es fija y no coincide con el `solicitud_id` del cuerpo; en la
    API real son el mismo valor. El `503` del mock trae siempre `Retry-After: 300`, también en `motorCaido`; la API
    real manda `30` con base o motor caídos. El mock acepta cualquier token `Bearer` y no tiene `500`.
